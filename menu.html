  <!-- Script de Partículas + Animação de Entrada ao carregar a página -->
  <script>
    // Animação de Entrada de Baixo para Cima ao carregar
    document.addEventListener("DOMContentLoaded", () => {
      const elementosAnimados = document.querySelectorAll(".animate-on-load");
      
      // Pequeno atraso para garantir que o navegador processou os elementos
      setTimeout(() => {
        elementosAnimados.forEach((el) => {
          el.classList.add("visible");
        });
      }, 100);
    });

    // Partículas de Fundo
    const canvas = document.getElementById("particulas");
    if (canvas) {
      const ctx = canvas.getContext("2d");
      let particulas = [];

      function ajustarCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      class Particula {
        constructor() {
          this.reset(true);
        }

        reset(inicial = false) {
          this.x = Math.random() * canvas.width;
          this.y = inicial ? Math.random() * canvas.height : canvas.height + 10;
          this.tamanho = Math.random() * 4 + 2; 
          this.velocidade = Math.random() * 1.2 + 0.4;
          this.opacidade = Math.random() * 0.6 + 0.3;
        }

        desenhar() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacidade})`;
          ctx.fill();
        }

        atualizar() {
          this.y -= this.velocidade;
          this.opacidade -= 0.001;

          if (this.y < -10 || this.opacidade <= 0) {
            this.reset(false);
          }
        }
      }

      function criarParticulas() {
        particulas = [];
        for (let i = 0; i < 300; i++) {
          particulas.push(new Particula());
        }
      }

      function animar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particulas.forEach((p) => {
          p.atualizar();
          p.desenhar();
        });
        requestAnimationFrame(animar);
      }

      ajustarCanvas();
      criarParticulas();
      animar();

      window.addEventListener("resize", () => {
        ajustarCanvas();
        criarParticulas();
      });
    }

    // SEGUIDOR DE CURSOR (BOLINHA) NO MENU
    const cursor = document.querySelector('.custom-cursor');

    if (cursor) {
      window.addEventListener('mousemove', (e) => {
        const x = e.clientX;
        const y = e.clientY;

        // Centra a bolinha perfeitamente no ponteiro (24px / 2 = 12px)
        cursor.style.left = `${x - 12}px`;
        cursor.style.top = `${y - 12}px`;
      });
    }
  </script>
